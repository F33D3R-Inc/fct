name: ci

# Every push/PR: tests + vet, govulncheck (stdlib and any future deps against
# the Go vulnerability database), and dependency review on PRs (flags newly
# introduced vulnerable or unlicensed deps — cheap to keep green while the
# framework is dependency-free).
#
# All third-party actions are pinned to commit SHAs (supply-chain policy:
# docs/REPRODUCIBLE_BUILDS.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

  wire-schema-drift:
    # SCHEMA_IDL_SCOPE.md Tier C's CI drift guard (§4 item 6): regenerates the
    # wire types from schema/facetql_wire.fct and fails if the committed
    # output in schema/generated/ doesn't match — the mechanism that makes
    # hand-editing a generated file, or forgetting to regenerate after a
    # schema change, structurally impossible to merge rather than review-
    # dependent (see schema/facetql_wire.fct's own header).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: Regenerate and diff
        run: |
          ./scripts/generate-wire.sh
          if ! git diff --exit-code -- schema/generated/; then
            echo "schema/generated/ is stale — run ./scripts/generate-wire.sh and commit the result"
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
