name: release

# On any v* tag push: run the tests, cross-compile the `facet` toolchain for
# every platform (pure Go, no CGO — runs anywhere), publish a GitHub Release with
# the binaries plus a sha256 checksums file. Third-party actions are pinned to
# commit SHAs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Test
        run: go test ./...

      - name: Cross-compile
        run: |
          bash scripts/build-release.sh "${GITHUB_REF_NAME}"
          cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install — prebuilt binary, nothing to compile

            Download the file for your platform below, then:

            - **macOS / Linux:** `chmod +x facet-*` and move it onto your PATH as
              `facet` (e.g. `sudo mv facet-linux-amd64 /usr/local/bin/facet`).
            - **Windows:** rename `facet-windows-amd64.exe` to `facet.exe` and put
              it on your PATH.

            ## Start building

            ```
            facet new myapp
            cd myapp
            export FACET_DATABASE_URL=postgres://user:pw@localhost:5432/yourdb
            facet run app.fct
            ```

            Open http://localhost:7373. The same app is also a JSON API at `/api`.
            Every binary is verified by `checksums.txt`.
