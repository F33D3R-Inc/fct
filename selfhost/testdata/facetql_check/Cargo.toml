[package]
name = "facetql_check"
version = "0.1.0"
edition = "2021"
publish = false

# The real facetql engine, used as a library: this binary is the Rust side
# of selfhost's byte-compatibility checks (facetql_check_test.go), run only
# when cargo is available. It never modifies facetql.
[dependencies]
facetql = { path = "../../../../facetql" }
bincode = "1.3"
serde_json = "1.0"

