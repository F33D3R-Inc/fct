[package]
name = "fabric_check"
version = "0.1.0"
edition = "2021"
publish = false

# The real fabric crates, used as libraries: this binary is the Rust side of
# selfhost's fabric wire-compatibility checks (fabric_leaf_a_test.go and any
# later fabric_*_test.go that needs the real types), run only when cargo is
# available. It never modifies fabric/.
[dependencies]
fabric-core = { path = "../../../../fabric/crates/fabric-core" }
fabric-telemetry = { path = "../../../../fabric/crates/fabric-telemetry" }
fabric-protocol = { path = "../../../../fabric/crates/fabric-protocol" }
fabric-runtime = { path = "../../../../fabric/crates/fabric-runtime" }
fabric-controller = { path = "../../../../fabric/crates/fabric-controller" }
fabric-migration = { path = "../../../../fabric/crates/fabric-migration" }
fabric-routing = { path = "../../../../fabric/crates/fabric-routing" }
fabric-topology = { path = "../../../../fabric/crates/fabric-topology" }
fabric-facetql = { path = "../../../../fabric/crates/fabric-facetql" }
fabric-daemon = { path = "../../../../fabric/crates/fabric-daemon" }
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
tokio = { version = "1", features = ["rt", "time"] }
# the no-timeout client CellMover::new takes for its GET /events stream
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
fabric-simulator = { path = "../../../../fabric/crates/fabric-simulator" }
fabric-optimizer = { path = "../../../../fabric/crates/fabric-optimizer" }
fabric-workload = { path = "../../../../fabric/crates/fabric-workload" }
serde_json = "1.0"
serde_path_to_error = "0.1"
serde = "1"

[workspace]
