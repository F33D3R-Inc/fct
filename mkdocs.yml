# Docs site. Build with: pip install mkdocs-material && mkdocs build (→ ./site),
# or `mkdocs serve` for a live preview; deploy ./site to GitHub Pages / any host.
site_name: Facet Architecture
site_description: A server-authoritative web framework — the opposite of React.
theme:
  name: material
  features: [navigation.sections, content.code.copy]
docs_dir: .
site_dir: site
nav:
  - Overview: README.md
  - Guide: GUIDE.md
  - Wiki:
      - Home: wiki/Home.md
      - Getting Started: wiki/Getting-Started.md
      - Building Your First Website: wiki/Building-Your-First-Website.md
      - Working with Databases: wiki/Working-with-Databases.md
      - Deployment: wiki/Deployment.md
      - FDL Reference: wiki/FDL-Reference.md
      - Standard Library: wiki/Standard-Library.md
      - Sessions, Auth & Forms: wiki/Sessions-Auth-and-Forms.md
      - Realtime Patterns: wiki/Realtime-Patterns.md
      - Admin Panel: wiki/Admin-Panel.md
      - Testing: wiki/Testing.md
      - Native Clients: wiki/Native-Clients.md
      - Troubleshooting & FAQ: wiki/Troubleshooting.md
  - Migrating from React: REACT_MIGRATION.md
  - Enterprise Readiness: ENTERPRISE.md
  - Security: SECURITY.md
  - Decisions (ADRs): DECISIONS.md
  - Changelog: CHANGELOG.md
  - Contributing: CONTRIBUTING.md
  - Governance: GOVERNANCE.md
  - Publishing: PUBLISHING.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables
