# One-command demo stack for the Facet toolchain: builds the image and serves the
# bundled Chirp example against a Postgres container.
#
#   docker compose up --build
#   open http://localhost:7373
#
# Point the `app` service's volume at your own .fct to run a different app, and
# set FACET_SECRET in the environment (or a .env file) for a real deployment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: facet
      POSTGRES_PASSWORD: facet
      POSTGRES_DB: facet
    volumes:
      - facet-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facet"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    command: ["run", "/app/app.fct", "0.0.0.0:7373"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      FACET_DATABASE_URL: postgres://facet:facet@db:5432/facet?sslmode=disable
      FACET_SECRET: ${FACET_SECRET:-dev-secret-change-me-0000000000000000000000000000}
      FACET_SECURE_COOKIES: "0"
    volumes:
      - ./examples/chirp.fct:/app/app.fct:ro
    ports:
      - "7373:7373"

volumes:
  facet-data:
